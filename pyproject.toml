[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zaptv"
version = "0.1.0"
description = "A fast launcher for live TV channels on Linux"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Channel logos are almost all JPEG and Tk's PhotoImage reads only PNG/GIF,
# so decoding needs an image library. This is the project's one deliberate
# exception to the zero-dependency rule in STACK.md.
dependencies = ["pillow>=10"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
zaptv = "zaptv.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zaptv = ["assets/*.png"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true

# Pillow ships no type information.
[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

# Tests are checked, but annotating every fixture and fake adds noise
# without catching bugs; the strict rules that matter still apply.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
